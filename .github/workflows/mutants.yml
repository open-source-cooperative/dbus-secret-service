name: Mutants

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  cargo-mutants:
    runs-on: ubuntu-latest
    steps:
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libssl-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-mutants
      - name: Install gnome-keyring
        run: sudo apt-get install -y gnome-keyring
      - name: Start gnome-keyring
        # run gnome-keyring with 'foobar' as password for the login keyring
        # this will create a new login keyring and unlock it
        # the login password doesn't matter, but the keyring must be unlocked for the tests to work
        run: gnome-keyring-daemon --components=secrets --daemonize --unlock <<< 'foobar'
      - run: git diff "origin/${GITHUB_BASE_REF}"...HEAD > pr.diff
      - run: cargo mutants --in-diff pr.diff --no-default-features --features crypto-rust
